name: Update IP Lists

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Iran: registry space + prefixes announced by Iranian ASNs.
      # If any check fails this step fails and nothing is committed,
      # so routers keep yesterday's list.
      - name: Generate Iran-IP
        run: python3 scripts/build_iran_ip.py

      - name: Generate other country lists
        run: |
          mkdir -p address-lists

          for country in tr ca us; do
            case $country in
              tr) name="Turkey-IP" ;;
              ca) name="Canada-IP" ;;
              us) name="USA-IP" ;;
            esac

            echo "Processing $name..."
            # ipverse renamed rir-ip to country-ip-blocks (January 2026);
            # the old name is kept as a fallback.
            base="https://raw.githubusercontent.com/ipverse"
            path="master/country/${country}/ipv4-aggregated.txt"
            body=$(curl -sf --retry 3 "$base/country-ip-blocks/$path" || curl -sf --retry 3 "$base/rir-ip/$path" || true)

            tmp=$(mktemp)
            echo "/ip firewall address-list remove [find list=${name}]" > "$tmp"

            printf '%s\n' "$body" | grep -v "^#" | grep -v "^$" | while read line; do
              echo "/ip firewall address-list add list=${name} address=${line} comment=RIPE" >> "$tmp"
            done

            count=$(grep -c "address-list add" "$tmp" || true)
            if [ "$count" -lt 100 ]; then
              echo "Skipped: $name - only $count prefixes downloaded, keeping the previous file"
              continue
            fi
            mv "$tmp" address-lists/${name}.rsc
            echo "Done: $name - $count prefixes"
          done

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add address-lists/
          git diff --staged --quiet || git commit -m "Update IP lists - $(date +'%Y-%m-%d')"
          git push
